<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AccessLens DC</title>
<style>
:root{--ink:#14242c;--muted:#60717a;--paper:#f3f0e8;--teal:#075e63;--orange:#d96c22;--line:#d5d9d8}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
header{background:#12343b;color:white;padding:22px 4vw;display:flex;justify-content:space-between;gap:20px;align-items:center}
h1{margin:0;font-size:25px}.sub{font-size:13px;color:#c8dcdd;margin-top:5px}.progress{font-weight:700}
main{padding:24px 4vw 100px;max-width:1400px;margin:auto}.notice{background:#fff6dc;border-left:5px solid #d99b22;padding:13px 16px;margin-bottom:18px}
.record{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 18px #14242c12}
.record-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.record h2{margin:0 0 4px}.meta{color:var(--muted);font-size:13px}
.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.image{background:#111;border-radius:10px;overflow:hidden}.image img{width:100%;height:390px;object-fit:contain;display:block}.caption{background:#1e292e;color:#dce5e8;padding:8px 10px;font-size:12px}
.empty{padding:70px 20px;text-align:center;background:#eef1f1;color:var(--muted);border-radius:10px;margin:18px 0}
fieldset{border:0;padding:0;margin:20px 0}legend{font-weight:700;margin-bottom:10px}.choices{display:flex;flex-wrap:wrap;gap:9px}
button,.choice{border:1px solid #aab4b7;background:white;color:var(--ink);border-radius:8px;padding:11px 14px;font-weight:650;cursor:pointer}.choice.selected{background:var(--teal);color:white;border-color:var(--teal)}
.truth .choice{font-size:16px;padding:14px 18px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:grid;gap:6px;font-size:13px;font-weight:650}select,input,textarea{font:inherit;border:1px solid #aab4b7;border-radius:7px;padding:10px;background:white}textarea{width:100%;min-height:75px;resize:vertical}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:13px 4vw;display:flex;justify-content:space-between;align-items:center;z-index:5}.nav-group{display:flex;gap:9px}.primary{background:var(--orange);border-color:var(--orange);color:white}.status{font-size:13px;color:var(--muted)}
@media(max-width:800px){.images,.form-grid{grid-template-columns:1fr}.image img{height:280px}header{align-items:start;flex-direction:column}.nav .status{display:none}}
</style></head><body>
<header><div><h1 id="page-title"></h1><div class="sub" id="page-subtitle"></div></div><div class="progress" id="progress"></div></header>
<main><div class="notice"><strong>Evidence rule:</strong> <span id="evidence-rule"></span></div><div id="app"></div></main>
<div class="nav"><div class="nav-group"><button id="previous">← Previous</button><button id="next">Next →</button></div><div class="status" id="save-status">Saved locally in this browser</div><div class="nav-group"><button id="export" class="primary">Export labels CSV</button></div></div>
<script>
const records=[{"record_id": "ADA_CurbRampPt_18645", "study_area": "anacostia_fairlawn", "latitude": "38.86849356883389", "longitude": "-76.98087721690601", "inventory_condition": "Fair", "year_inspected": "2016", "images": [{"image_id": "1014222285942022", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_18645/1014222285942022.jpg", "captured_at": "2020-12-10T13:47:03.500000+00:00", "distance_m": "3.32", "heading_difference": "97.63", "is_pano": "True", "projection_method": "source_image"}, {"image_id": "1110578453899788", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_18645/1110578453899788.jpg", "captured_at": "2024-12-28T15:09:23.781000+00:00", "distance_m": "9.54", "heading_difference": "39.79", "is_pano": "False", "projection_method": "source_image"}]}, {"record_id": "ADA_CurbRampPt_11753", "study_area": "anacostia_fairlawn", "latitude": "38.86581346352636", "longitude": "-76.97945035983177", "inventory_condition": "Good", "year_inspected": "2016", "images": [{"image_id": "1025729343731173", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_11753/1025729343731173.jpg", "captured_at": "2026-06-26T14:57:45.701000+00:00", "distance_m": "4.13", "heading_difference": "6.22", "is_pano": "False", "projection_method": "source_image"}, {"image_id": "1143286596180012", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_11753/1143286596180012.jpg", "captured_at": "2019-11-10T17:47:14+00:00", "distance_m": "5.13", "heading_difference": "35.87", "is_pano": "True", "projection_method": "source_image"}]}, {"record_id": "ADA_CurbRampPt_31142", "study_area": "anacostia_fairlawn", "latitude": "38.85930735726929", "longitude": "-76.9886330409881", "inventory_condition": "Missing", "year_inspected": "2016", "images": [{"image_id": "1171979521528074", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_31142/1171979521528074.jpg", "captured_at": "2025-11-12T17:12:31.474000+00:00", "distance_m": "2.39", "heading_difference": "9.92", "is_pano": "False", "pr "inventory_condition": "Good", "year_inspected": "2016", "images": [{"image_id": "1387181318324936", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_28492/1387181318324936.jpg", "captured_at": "2019-07-27T20:27:53+00:00", "distance_m": "39.32", "heading_difference": "0.21", "is_pano": "False", "projection_method": "source_image"}, {"image_id": "1147891249034894", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_28492/1147891249034894.jpg", "captured_at": "2019-12-19T18:05:30.284000+00:00", "distance_m": "39.36", "heading_difference": "6.95", "is_pano": "False", "projection_method": "source_image"}]}, {"record_id": "ADA_CurbRampPt_2568", "study_area": "columbia_heights_petworth", "latitude": "38.93555188315029", "longitude": "-77.02712071296699", "inventory_condition": "Missing", "year_inspected": "2016", "images": [{"image_id": "161294106608412", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_2568/161294106608412.jpg", "captured_at": "2022-12-07T18:57:19.984000+00:00", "distance_m": "10.35", "heading_difference": "44.27", "is_pano": "False", "projection_method": "source_image"}, {"image_id": "147945997354667", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_2568/147945997354667.jpg", "captured_at": "2019-07-27T13:13:23+00:00", "distance_m": "13.18", "heading_difference": "33.46", "is_pano": "False", "projection_method": "source_image"}]}, {"record_id": "ADA_CurbRampPt_23006", "study_area": "columbia_heights_petworth", "latitude": "38.93402871611946", "longitude": "-77.02616414111131", "inventory_condition": "Non-Compliant", "year_inspected": "2016", "images": [{"image_id": "1331522562340689", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_23006/1331522562340689.jpg", "captured_at": "2025-12-03T13:03:22.782000+00:00", "distance_m": "6.77", "heading_difference": "20.76", "is_pano": "False", "projection_method": "source_image"}, {"image_id": "1191360726455637", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_23006/1191360726455637.jpg", "captured_at": "2025-12-03T13:19:17.839000+00:00", "distance_m": "7.8", "heading_difference": "27.93", "is_pano": "False", "projection_method": "source_image"}]}, {"record_id": "ADA_CurbRampPt_27682", "study_area": "navy_yard_capitol_riverfront", "latitude": "38.873359991402225", "longitude": "-76.99166333582677", "inventory_condition": "Fair", "year_inspected": "2016", "images": [{"image_id": "105474755634177", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_27682/105474755634177.jpg", "captured_at": "2022-01-14T12:01:37+00:00", "distance_m": "36.04", "heading_difference": "8.68", "is_pano": "False", "projection_method": "source_image"}, {"image_id": "1021053455094760", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_27682/1021053455094760.jpg", "captured_at": "2019-09-14T16:00:34.500000+00:00", "distance_m": "37.72", "heading_difference": "43.37", "is_pano": "False", "projection_method": "source_image"}]}, {"record_id": "ADA_CurbRampPt_20386", "study_area": "navy_yard_capitol_riverfront", "latitude": "38.87945040421178", "longitude": "-77.0001454777056", "inventory_condition": "Good", "year_inspected": "2016", "images": [{"image_id": "2444098789057934", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_20386/2444098789057934.jpg", "captured_at": "2020-01-10T13:59:23.500000+00:00", "distance_m": "17.73", "heading_difference": "85.67", "is_pano": "True", "projection_method": "source_image"}, {"image_id": "211229097326569", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_20386/211229097326569.jpg", "captured_at": "2020-01-10T13:59:24+00:00", "distance_m": "18.36", "heading_difference": "104.65", "is_pano": "True", "projection_method": "source_image"}]}, {"record_id": "ADA_CurbRampPt_19095", "study_area": "navy_yard_capitol_riverfront", "latitude": "38.88863329482785", "longitude": "-76.99609936102561", "inventory_condition": "Missing", "year_inspected": "2016", "images": []}, {"record_id": "ADA_CurbRampPt_22233", "study_area": "navy_yard_capitol_riverfront", "latitude": "38.885536428453804", "longitude": "-76.99014234429353", "inventory_condition": "Non-Compliant", "year_inspected": "2016", "images": [{"image_id": "1023804108193064", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_22233/1023804108193064.jpg", "captured_at": "2019-11-25T14:10:53.289000+00:00", "distance_m": "6.23", "heading_difference": "10.91", "is_pano": "False", "projection_method": "source_image"}, {"image_id": "1193942281121807", "path": "../data/images/mapillary_pilot/ADA_CurbRampPt_22233/1193942281121807.jpg", "captured_at": "2019-11-25T13:57:52.173000+00:00", "distance_m": "7.77", "heading_difference": "61.53", "is_pano": "False", "projection_method": "source_image"}]}];
const pageConfig={"storageKey": "accesslens-pilot-labels-v1", "exportFilename": "accesslens_pilot_labels.csv", "title": "AccessLens DC", "subtitle": "Blind pilot labeling \u00b7 historical inventory condition is hidden", "notice": "Label the target record only when the corner is visible enough to judge. Use cannot_determine when the view is distant, blocked, aimed elsewhere, or geometrically ambiguous."};
const storageKey=pageConfig.storageKey;
document.getElementById('page-title').textContent=pageConfig.title;
document.getElementById('page-subtitle').textContent=pageConfig.subtitle;
document.getElementById('evidence-rule').textContent=pageConfig.notice;
let labels=JSON.parse(localStorage.getItem(storageKey)||'{}'); let index=0;
const truthOptions=[['ramp_present','Ramp present (1)'],['ramp_absent','Ramp absent (2)'],['cannot_determine','Cannot determine (3)']];
function current(){const r=records[index]; labels[r.record_id] ||= {truth_label:'',image_quality:'',occlusion:'',detectable_warning:'',labeler:'',notes:'',label_timestamp:''}; return [r,labels[r.record_id]]}
function save(){localStorage.setItem(storageKey,JSON.stringify(labels)); document.getElementById('save-status').textContent='Saved '+new Date().toLocaleTimeString(); updateProgress()}
function isComplete(l){return Boolean(l?.truth_label&&l?.image_quality&&l?.occlusion&&l?.detectable_warning)}
function updateProgress(){const done=records.filter(r=>isComplete(labels[r.record_id])).length; document.getElementById('progress').textContent=`${done}/${records.length} complete`}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function imageHtml(i){const method=i.projection_method==='source_image'?'source view':i.projection_method.replaceAll('_',' ');return `<div class="image"><img src="${escapeHtml(i.path)}"><div class="caption">${escapeHtml(i.captured_at.slice(0,10))} · ${Number(i.distance_m).toFixed(1)} m · ${escapeHtml(method)}</div></div>`}
function selectHtml(field,values,value){return `<select data-field="${field}"><option value="">Select…</option>${values.map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('')}</select>`}
function render(){const [r,l]=current(); const images=r.images.length?r.images.map(imageHtml).join(''):'<div class="empty">No imagery returned for this record. Label cannot determine.</div>';
document.getElementById('app').innerHTML=`<section class="record"><div class="record-head"><div><h2>${escapeHtml(r.record_id)}</h2><div class="meta">${escapeHtml(r.study_area.replaceAll('_',' '))} · record ${index+1} of ${records.length}</div></div><div class="meta">${r.images.length} image(s)</div></div><div class="images">${images}</div>
<fieldset class="truth"><legend>Truth label</legend><div class="choices">${truthOptions.map(([v,t])=>`<button class="choice ${l.truth_label===v?'selected':''}" data-truth="${v}">${t}</button>`).join('')}</div></fieldset>
<div class="form-grid"><label>Overall image quality${selectHtml('image_quality',['good','usable','poor','unusable'],l.image_quality)}</label><label>Occlusion${selectHtml('occlusion',['none','partial','severe','unknown'],l.occlusion)}</label><label>Detectable warning${selectHtml('detectable_warning',['visible','not_visible','cannot_determine'],l.detectable_warning)}</label></div>
<div class="form-grid" style="margin-top:14px"><label>Labeler<input data-field="labeler" value="${escapeHtml(l.labeler)}" placeholder="Your name"></label></div><label style="margin-top:14px">Notes<textarea data-field="notes" placeholder="What made this decision clear or uncertain?">${escapeHtml(l.notes)}</textarea></label></section>`;
document.querySelectorAll('[data-truth]').forEach(b=>b.onclick=()=>{l.truth_label=b.dataset.truth;l.label_timestamp=new Date().toISOString();save();render()});
document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{l[el.dataset.field]=el.value;save()}); document.getElementById('previous').disabled=index===0;document.getElementById('next').disabled=index===records.length-1;updateProgress()}
function move(delta){index=Math.max(0,Math.min(records.length-1,index+delta));render();scrollTo(0,0)}
document.getElementById('previous').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='1'||e.key==='2'||e.key==='3'){const [,l]=current();l.truth_label=truthOptions[Number(e.key)-1][0];l.label_timestamp=new Date().toISOString();save();render()}else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1)});
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
document.getElementById('export').onclick=()=>{const incomplete=records.filter(r=>!isComplete(labels[r.record_id]));if(incomplete.length){alert(`Complete truth, image quality, occlusion, and detectable warning for every record before export. Missing: ${incomplete.map(r=>r.record_id).join(', ')}`);return}const fields=['record_id','study_area','latitude','longitude','inventory_condition','year_inspected','image_ids','image_paths','truth_label','image_quality','occlusion','detectable_warning','labeler','label_timestamp','notes'];const lines=[fields.join(',')];for(const r of records){const l=labels[r.record_id]||{};const row={...r,...l,image_ids:r.images.map(i=>i.image_id).join('|'),image_paths:r.images.map(i=>i.path.startsWith('../')?i.path.slice(3):i.path).join('|')};lines.push(fields.map(f=>csvCell(row[f])).join(','))}const blob=new Blob([lines.join('\n')+'\n'],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=pageConfig.exportFilename;a.click();URL.revokeObjectURL(a.href)};
render();
</script></body></html>
